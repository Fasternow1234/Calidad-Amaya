# Perfil local para pruebas funcionales. Requiere una base de datos separada.
spring.application.name=Backend-Amaya-test
server.port=8080

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/bd_amaya_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.apis.token=${APP_APIS_TOKEN:}
